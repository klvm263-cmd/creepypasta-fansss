<!DOCTYPE html>
<html>

<head>

<title>Characters | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>👁 Character Archive 👁</h1>


<nav>

<a href="index.html">🏠 Home</a>
<a href="stories.html">📖 Stories</a>
<a href="characters.html">👁 Characters</a>
<a href="games.html">🎮 Games</a>
<a href="editor.html">🔒 Editor</a>

</nav>


</header>



<main>


<h2>Tap A Character</h2>


<div id="characterList"></div>



</main>




<script>


let characters =
JSON.parse(localStorage.getItem("characters")) || [];


let list =
document.getElementById("characterList");



if(characters.length === 0){


list.innerHTML = `

<div class="card">

<h3>No Characters Yet</h3>

<p>Add characters in Owner Editor.</p>

</div>

`;

}



characters.forEach(function(character){


list.innerHTML += `


<a href="character.html?id=${character.id}" style="text-decoration:none;color:white;">


<div class="card">


<h2>
${character.name}
</h2>


<img src="${character.image}" width="220">


<p>
Tap to read lore
</p>


</div>


</a>


`;



});


</script>



</body>

</html>
