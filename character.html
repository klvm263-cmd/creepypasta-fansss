<!DOCTYPE html>
<html>

<head>

<title>Character Lore | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="profilePage">


<a href="characters.html">

<button>
⬅ Back To Characters
</button>

</a>



<div id="profile"></div>


</div>




<script>


let characters =
JSON.parse(localStorage.getItem("characters")) || [];



let params =
new URLSearchParams(window.location.search);



let id =
params.get("id");



let character =
characters.find(x => x.id == id);



let profile =
document.getElementById("profile");



if(character){


profile.innerHTML = `


<h1>

${character.name}

</h1>



<img class="profileImage" src="${character.image}">



<h2>
☠ LORE ☠
</h2>



<div class="lore">

${character.info}

</div>



`;



}

else{


profile.innerHTML = `

<h1>
Character Not Found
</h1>

`;

}



</script>



</body>

</html>
