<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fan Games | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎮 Creepypasta Fan Games 🎮</h1>

<p>
The archive of horror games and creepy projects.
</p>


<nav>

<a href="index.html">🏠 Home</a>

<a href="stories.html">📖 Stories</a>

<a href="characters.html">👁 Characters</a>

<a href="games.html">🎮 Games</a>

<a href="editor.html">🔒 Editor</a>

</nav>


</header>



<main>


<h2>🎮 Game Archive</h2>


<div id="gameList"></div>



</main>



<footer>

<p>
☠ Creepypasta Fansss Archive ☠
</p>

</footer>



<script>


// Get saved games

let games = JSON.parse(localStorage.getItem("games")) || [];


// Find where games go

let gameList = document.getElementById("gameList");



// If there are no games

if(games.length === 0){


gameList.innerHTML = `

<div class="card">

<h3>🌑 No Games Added</h3>

<p>
The owner has not added any games yet.
</p>

</div>

`;


}



// Show games

else {


games.forEach(function(game){


gameList.innerHTML += `


<div class="card">


<h3>🎮 ${game.name}</h3>


<p>

${game.description}

</p>


<a href="#">

View Game

</a>


</div>


`;


});


}



</script>



</body>

</html>
