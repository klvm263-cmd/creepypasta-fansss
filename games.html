<!DOCTYPE html>
<html>

<head>

<title>Games | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎮 Game Archive 🎮</h1>


<nav>

<a href="index.html">🏠 Home</a>
<a href="stories.html">📖 Stories</a>
<a href="characters.html">👁 Characters</a>
<a href="games.html">🎮 Games</a>
<a href="editor.html">🔒 Editor</a>

</nav>

</header>



<main>


<h2>Tap A Game</h2>


<div id="gameList"></div>


</main>




<script>


let games =
JSON.parse(localStorage.getItem("games")) || [];


let list =
document.getElementById("gameList");



if(games.length === 0){


list.innerHTML = `

<div class="card">

<h3>No Games Yet</h3>

<p>Add games in Owner Editor.</p>

</div>

`;

}



games.forEach(function(game){


list.innerHTML += `


<a href="game.html?id=${game.id}" style="text-decoration:none;color:white;">


<div class="card">


<h2>
🎮 ${game.name}
</h2>


<p>
Tap to view game
</p>


</div>


</a>


`;



});


</script>



</body>

</html>
