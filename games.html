<!DOCTYPE html>
<html>

<head>

<title>Games | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎮 Creepypasta Fan Games 🎮</h1>


<nav>

<a href="index.html">🏠 Home</a>

<a href="stories.html">📖 Stories</a>

<a href="characters.html">👁 Characters</a>

<a href="games.html">🎮 Games</a>

<a href="editor.html">🔒 Editor</a>

</nav>


</header>



<main>


<h2>Game Archive</h2>


<div id="gameList"></div>



</main>



<footer>

☠ Creepypasta Fansss ☠

</footer>




<script>


let games = JSON.parse(localStorage.getItem("games")) || [];


let gameList = document.getElementById("gameList");



if(games.length == 0){


gameList.innerHTML = `

<div class="card">

<h3>No Games Yet</h3>

<p>
The owner has not added any games.
</p>

</div>

`;



}



games.forEach(function(game){


gameList.innerHTML += `


<div class="card">


<h3>🎮 ${game.name}</h3>


<p>

${game.info}

</p>



</div>


`;



});



</script>



</body>

</html>
