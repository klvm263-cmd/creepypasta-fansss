<!DOCTYPE html>
<html lang="en">

<head>

<title>Owner Dashboard | Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>☠ OWNER DASHBOARD ☠</h1>

<nav>
<a href="index.html">Home</a>
<a href="stories.html">Stories</a>
<a href="characters.html">Characters</a>
<a href="games.html">Games</a>
</nav>

</header>



<main>


<h2>Add A Story</h2>


<input id="storyTitle" placeholder="Story Title">

<br><br>

<textarea id="storyDescription" placeholder="Story Description"></textarea>

<br><br>

<button onclick="addStory()">
🩸 Add Story
</button>



<h2>Add A Character</h2>


<input id="characterName" placeholder="Character Name">

<br><br>

<textarea id="characterDescription" placeholder="Character Description"></textarea>

<br><br>

<button onclick="addCharacter()">
👁 Add Character
</button>



<h2>Add A Game</h2>


<input id="gameName" placeholder="Game Name">

<br><br>

<textarea id="gameDescription" placeholder="Game Description"></textarea>

<br><br>

<button onclick="addGame()">
🎮 Add Game
</button>


<p id="status"></p>


</main>



<script>


function addStory(){

let title =
document.getElementById("storyTitle").value;


let description =
document.getElementById("storyDescription").value;


let stories =
JSON.parse(localStorage.getItem("stories")) || [];


stories.push({

title:title,
description:description

});


localStorage.setItem(
"stories",
JSON.stringify(stories)
);


document.getElementById("status").innerHTML =
"✅ Story Added!";


}




function addCharacter(){

let name =
document.getElementById("characterName").value;


let description =
document.getElementById("characterDescription").value;


let characters =
JSON.parse(localStorage.getItem("characters")) || [];


characters.push({

name:name,
description:description

});


localStorage.setItem(
"characters",
JSON.stringify(characters)
);


document.getElementById("status").innerHTML =
"✅ Character Added!";


}





function addGame(){

let name =
document.getElementById("gameName").value;


let description =
document.getElementById("gameDescription").value;


let games =
JSON.parse(localStorage.getItem("games")) || [];


games.push({

name:name,
description:description

});


localStorage.setItem(
"games",
JSON.stringify(games)
);


document.getElementById("status").innerHTML =
"✅ Game Added!";


}



</script>


</body>

</html>
