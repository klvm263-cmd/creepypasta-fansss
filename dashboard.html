<!DOCTYPE html>
<html>

<head>

<title>Creepypasta Fansss Editor</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<h1>☠ OWNER EDITOR ☠</h1>


<h2>Add Story</h2>

<input id="story" placeholder="Story name">

<br><br>

<textarea id="storyInfo" placeholder="Story description"></textarea>

<br><br>

<button onclick="addStory()">
Add Story
</button>



<h2>Add Game</h2>

<input id="game" placeholder="Game name">

<br><br>

<textarea id="gameInfo" placeholder="Game description"></textarea>

<br><br>

<button onclick="addGame()">
Add Game
</button>



<h2>Add Character</h2>

<input id="character" placeholder="Character name">

<br><br>

<textarea id="characterInfo" placeholder="Character description"></textarea>

<br><br>

<button onclick="addCharacter()">
Add Character
</button>



<h2>Your Added Stuff</h2>

<div id="list"></div>



<script>


function show(){

let list=document.getElementById("list");

list.innerHTML="";


let stories=
JSON.parse(localStorage.getItem("stories")) || [];


let games=
JSON.parse(localStorage.getItem("games")) || [];


let characters=
JSON.parse(localStorage.getItem("characters")) || [];



stories.forEach(function(x){

list.innerHTML +=

"<div class='card'>" +

"<h3>📖 "+x.name+"</h3>" +

"<p>"+x.info+"</p>" +

"<button onclick='removeStory("+x.id+")'>Delete</button>" +

"</div>";

});



games.forEach(function(x){

list.innerHTML +=

"<div class='card'>" +

"<h3>🎮 "+x.name+"</h3>" +

"<p>"+x.info+"</p>" +

"<button onclick='removeGame("+x.id+")'>Delete</button>" +

"</div>";

});



characters.forEach(function(x){

list.innerHTML +=

"<div class='card'>" +

"<h3>👁 "+x.name+"</h3>" +

"<p>"+x.info+"</p>" +

"<button onclick='removeCharacter("+x.id+")'>Delete</button>" +

"</div>";

});


}



function addStory(){

let stories=
JSON.parse(localStorage.getItem("stories")) || [];


stories.push({

id:Date.now(),

name:story.value,

info:storyInfo.value

});


localStorage.setItem(
"stories",
JSON.stringify(stories)
);


show();

}



function addGame(){

let games=
JSON.parse(localStorage.getItem("games")) || [];


games.push({

id:Date.now(),

name:game.value,

info:gameInfo.value

});


localStorage.setItem(
"games",
JSON.stringify(games)
);


show();

}



function addCharacter(){

let characters=
JSON.parse(localStorage.getItem("characters")) || [];


characters.push({

id:Date.now(),

name:character.value,

info:characterInfo.value

});


localStorage.setItem(
"characters",
JSON.stringify(characters)
);


show();

}




function removeStory(id){

let stories=
JSON.parse(localStorage.getItem("stories")) || [];


stories =
stories.filter(x=>x.id!=id);


localStorage.setItem(
"stories",
JSON.stringify(stories)
);


show();

}



function removeGame(id){

let games=
JSON.parse(localStorage.getItem("games")) || [];


games =
games.filter(x=>x.id!=id);


localStorage.setItem(
"games",
JSON.stringify(games)
);


show();

}



function removeCharacter(id){

let characters=
JSON.parse(localStorage.getItem("characters")) || [];


characters =
characters.filter(x=>x.id!=id);


localStorage.setItem(
"characters",
JSON.stringify(characters)
);


show();

}



show();


</script>


</body>

</html>
