<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Owner Dashboard - Creepypasta Fansss</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>☠ OWNER DASHBOARD ☠</h1>

<nav>

<a href="index.html">Home</a>
<a href="stories.html">Stories</a>
<a href="characters.html">Characters</a>
<a href="games.html">Games</a>

</nav>

</header>



<main>


<h2>Add Story</h2>

<input id="storyTitle" placeholder="Story title">

<br><br>

<textarea id="storyText" placeholder="Story description"></textarea>

<br><br>

<button onclick="addStory()">
Add Story
</button>



<h2>Add Character</h2>

<input id="characterName" placeholder="Character name">

<br><br>

<textarea id="characterText" placeholder="Character description"></textarea>

<br><br>

<button onclick="addCharacter()">
Add Character
</button>



<h2>Add Game</h2>

<input id="gameName" placeholder="Game name">

<br><br>

<textarea id="gameText" placeholder="Game description"></textarea>

<br><br>

<button onclick="addGame()">
Add Game
</button>



<hr>


<h2>Manage Content</h2>


<div id="manage"></div>



</main>



<script>


function getData(name){

return JSON.parse(localStorage.getItem(name)) || [];

}



function saveData(name,data){

localStorage.setItem(name,JSON.stringify(data));

}



function addStory(){

let stories=getData("stories");


stories.push({

id:Date.now(),

title:
storyTitle.value,

text:
storyText.value

});


saveData("stories",stories);

loadManage();

}



function addCharacter(){

let characters=getData("characters");


characters.push({

id:Date.now(),

name:
characterName.value,

text:
characterText.value

});


saveData("characters",characters);

loadManage();

}



function addGame(){

let games=getData("games");


games.push({

id:Date.now(),

name:
gameName.value,

text:
gameText.value

});


saveData("games",games);

loadManage();

}





function deleteItem(type,id){

let data=getData(type);


data=data.filter(item=>item.id!=id);


saveData(type,data);


loadManage();

}





function editItem(type,id){


let data=getData(type);


let item=data.find(x=>x.id==id);


let newText=prompt(
"Edit content:",
item.text
);


if(newText){

item.text=newText;

}


saveData(type,data);


loadManage();


}





function loadManage(){


let box=document.getElementById("manage");


box.innerHTML="";



let groups=[

["stories","📖 Stories"],

["characters","👁 Characters"],

["games","🎮 Games"]

];



groups.forEach(group=>{


let data=getData(group[0]);


box.innerHTML+=`<h3>${group[1]}</h3>`;



data.forEach(item=>{


let name=item.title || item.name;


box.innerHTML+=`

<div class="card">

<h3>${name}</h3>

<p>${item.text}</p>


<button onclick="editItem('${group[0]}',${item.id})">

Edit

</button>


<button onclick="deleteItem('${group[0]}',${item.id})">

Delete

</button>


</div>

`;


});


});


}



loadManage();


</script>



</body>

</html>
